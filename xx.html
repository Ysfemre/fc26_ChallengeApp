<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC 26 Ultimate Challenge</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Inter:ital,wght@0,400;0,700;1,700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #091210, #022b16, #000000, #0a1f15);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(10px, 3vw, 20px);
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            background-color: rgba(10, 15, 12, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 135, 0.2);
            border-radius: 16px;
            padding: clamp(15px, 4vw, 30px);
            width: 100%;
            max-width: 750px;
            box-shadow: 0 0 40px rgba(0, 255, 135, 0.1);
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: clamp(32px, 6vw, 46px);
            text-align: center;
            margin-bottom: clamp(15px, 3vw, 25px);
            color: #00FF87;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 135, 0.3);
            line-height: 1.1;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(10px, 2vw, 15px);
            margin-bottom: clamp(20px, 4vw, 30px);
            background: rgba(0, 0, 0, 0.4);
            padding: clamp(10px, 2vw, 15px);
            border-radius: 12px;
            border: 1px solid #1f2924;
        }

        .section-title {
            grid-column: span 2;
            font-family: 'Teko', sans-serif;
            font-size: clamp(20px, 4vw, 24px);
            color: #a1a1aa;
            margin-bottom: 5px;
            letter-spacing: 1px;
            border-bottom: 1px solid #1f2924;
            padding-bottom: 5px;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .options-group.row {
            flex-direction: row;
            grid-column: span 2;
        }

        .options-group input[type="radio"] {
            display: none;
        }

        .options-group label {
            background-color: #121815;
            border: 1px solid #1f2924;
            padding: clamp(8px, 2vw, 12px) clamp(10px, 2vw, 15px);
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s ease;
            font-size: clamp(12px, 3vw, 14px);
            font-weight: 700;
            color: #d4d4d8;
            font-style: italic;
            text-align: center;
            flex: 1;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .options-group label:hover {
            border-color: #00FF87;
        }

        .options-group input[type="radio"]:checked+label {
            background-color: #00FF87;
            border-color: #00FF87;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
        }

        .match-area {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            gap: clamp(15px, 3vw, 20px);
        }

        .player-card {
            flex: 1;
            background: linear-gradient(180deg, #121815 0%, #0a0c0a 100%);
            border: 2px solid #1f2924;
            border-radius: 12px;
            padding: clamp(15px, 3vw, 25px) clamp(10px, 2vw, 20px);
            text-align: center;
            position: relative;
            min-height: clamp(200px, 30vh, 250px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
        }

        .player-title {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #00FF87;
            color: #000;
            padding: 2px 15px;
            border-radius: 20px;
            font-size: clamp(10px, 2.5vw, 12px);
            font-weight: 800;
            font-style: italic;
            white-space: nowrap;
        }

        .action-btn,
        .reset-all-btn,
        .tekrar-btn {
            width: 100%;
            font-weight: 800;
            font-style: italic;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .action-btn {
            padding: clamp(12px, 3vw, 15px);
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: clamp(14px, 3.5vw, 16px);
        }

        .action-btn:hover {
            background-color: #00FF87;
            box-shadow: 0 0 20px rgba(0, 255, 135, 0.5);
            transform: scale(1.02);
        }

        .tekrar-btn {
            display: none;
            margin-top: 15px;
            padding: clamp(8px, 2vw, 10px);
            background: transparent;
            border: 1px solid #00FF87;
            color: #00FF87;
            border-radius: 6px;
            font-size: clamp(12px, 3vw, 14px);
        }

        .tekrar-btn:hover {
            background: #00FF87;
            color: #000;
        }

        .reset-all-btn {
            display: none;
            margin: clamp(20px, 4vw, 30px) auto 0 auto;
            max-width: 400px;
            padding: clamp(12px, 3vw, 15px);
            background: linear-gradient(90deg, #ff003c 0%, #c5002e 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: clamp(14px, 3.5vw, 18px);
            box-shadow: 0 5px 15px rgba(255, 0, 60, 0.2);
        }

        .reset-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 0, 60, 0.4);
        }

        .loader {
            display: none;
            margin: 0 auto;
            border: 3px solid rgba(0, 255, 135, 0.1);
            border-top: 3px solid #00FF87;
            border-radius: 50%;
            width: clamp(35px, 8vw, 50px);
            height: clamp(35px, 8vw, 50px);
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .team-result {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .team-name {
            font-family: 'Teko', sans-serif;
            font-size: clamp(26px, 6vw, 34px);
            line-height: 1.1;
            color: #fff;
            margin-bottom: 8px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .team-rank {
            font-size: clamp(14px, 3.5vw, 16px);
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }

        .team-league {
            font-size: clamp(13px, 3vw, 15px);
            color: #00FF87;
            font-weight: 800;
            text-transform: uppercase;
        }

        .team-country {
            font-size: clamp(11px, 2.5vw, 13px);
            color: #8a8a93;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .vs-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Teko', sans-serif;
            font-size: clamp(28px, 6vw, 40px);
            color: #fff;
            opacity: 0.5;
        }

        @media (max-width: 650px) {
            .match-area {
                flex-direction: column;
                gap: 25px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .section-title {
                grid-column: span 1;
                margin-bottom: 0;
            }

            .options-group.row {
                grid-column: span 1;
            }

            .vs-badge {
                padding: 10px 0;
                margin: -10px 0;
            }
        }

        @media (max-width: 380px) {
            .options-group.row {
                flex-direction: column;
            }
        }
    </style>
</head>

        function ulkeBul(lig, takimAdi, tur) {
            if (tur === "national") return takimAdi;

            if (takimAdi === "Dynamo Kyiv" || takimAdi === "Shakhtar Donetsk") return "Ukrayna";
            if (takimAdi === "Union Saint-Gilloise" || takimAdi === "Club Brugge KV" || takimAdi === "KRC Genk") return "Belçika";
            if (lig === "Pro League") return "Suudi Arabistan";

            const ulkeler = {
                "Ligue 1": "Fransa", "La Liga": "İspanya", "Premier League": "İngiltere",
                "Bundesliga": "Almanya", "Serie A": "İtalya", "Süper Lig": "Türkiye",
                "Primeira Liga": "Portekiz", "Eredivisie": "Hollanda", "Série A": "Brezilya",
                "Super League": "Yunanistan", "První liga": "Çekya", "Premiership": "İskoçya",
                "Liga Profesional de Fútbol": "Arjantin", "Championship": "İngiltere",
                "Serie B": "İtalya", "La Liga 2": "İspanya"
            };
            return ulkeler[lig] || "Bilinmiyor";
        }

        let p1Index = -1;
        let p2Index = -1;

        function oyunuSifirla() {
            p1Index = -1;
            p2Index = -1;

            document.getElementById('btn-p1').style.display = 'block';
            document.getElementById('btn-p2').style.display = 'block';

            document.getElementById('res-p1').style.display = 'none';
            document.getElementById('res-p2').style.display = 'none';
            document.getElementById('res-p1').style.opacity = '0';
            document.getElementById('res-p2').style.opacity = '0';

            document.getElementById('reroll-1').style.display = 'none';
            document.getElementById('reroll-2').style.display = 'none';
            document.getElementById('reset-all').style.display = 'none';
        }

        function kuraCek(oyuncuNo) {
            const tur = document.querySelector('input[name="type"]:checked').value;
            const havuz = document.querySelector('input[name="pool"]:checked').value;
            const mod = document.querySelector('input[name="mode"]:checked').value;

            let seciliListe = tur === "club" ? kulupler : milliTakimlar;
            if (havuz === "legendary") seciliListe = seciliListe.slice(0, 10);
            if (havuz === "best") seciliListe = seciliListe.slice(0, 28);

            document.getElementById(`btn-p${oyuncuNo}`).style.display = 'none';
            document.getElementById(`reroll-${oyuncuNo}`).style.display = 'none';
            document.getElementById('reset-all').style.display = 'none';

            let sonucKutusu = document.getElementById(`res-p${oyuncuNo}`);
            sonucKutusu.style.opacity = '0';

            document.getElementById(`load-p${oyuncuNo}`).style.display = 'block';

            let cekilenIndex = -1;
            let digerOyuncuIndex = oyuncuNo === 1 ? p2Index : p1Index;

            // --- ESKİ SİSTEME DÖNÜŞ VE "AYNI TAKIM GELMESİN" DÖNGÜSÜ (do-while) ---
            if (digerOyuncuIndex === -1 || mod === "random") {
                // Rastgele seçerken "Acaba diğer oyuncunun takımıyla aynı mı?" diye kontrol eder.
                // Aynıysa, arka planda farklı takım bulana kadar yeniden çeker.
                do {
                    cekilenIndex = Math.floor(Math.random() * seciliListe.length);
                } while (cekilenIndex === digerOyuncuIndex && seciliListe.length > 1);
            }
            // --- YAKIN GÜÇ (CLOSE) MODU ---
            else {
                let merkez = digerOyuncuIndex;
                let yon = Math.random() < 0.5 ? "ust" : "alt";

                if (merkez === 0) yon = "alt";
                if (merkez === seciliListe.length - 1) yon = "ust";

                let secenekler = [];
                if (yon === "ust") {
                    let sinir = Math.max(0, merkez - 5);
                    // Döngü "merkez"e kadar (i < merkez) çalıştığı için aynı takım zaten listeye girmez.
                    for (let i = sinir; i < merkez; i++) secenekler.push(i);
                } else {
                    let sinir = Math.min(seciliListe.length - 1, merkez + 5);
                    // Döngü merkezden bir sonrakinden (merkez + 1) başladığı için aynı takım giremez.
                    for (let i = merkez + 1; i <= sinir; i++) secenekler.push(i);
                }

                cekilenIndex = secenekler[Math.floor(Math.random() * secenekler.length)];
            }

            if (oyuncuNo === 1) p1Index = cekilenIndex;
            else p2Index = cekilenIndex;

            setTimeout(() => {
                document.getElementById(`load-p${oyuncuNo}`).style.display = 'none';

                let takim = seciliListe[cekilenIndex];

                document.getElementById(`name-p${oyuncuNo}`).innerHTML = `${takim.ad} <span class="team-rank">#${takim.sira}</span>`;
                document.getElementById(`league-p${oyuncuNo}`).innerText = takim.lig;
                document.getElementById(`country-p${oyuncuNo}`).innerText = ulkeBul(takim.lig, takim.ad, tur);

                sonucKutusu.style.display = 'flex';
                sonucKutusu.style.flexDirection = 'column';
                setTimeout(() => sonucKutusu.style.opacity = '1', 50);

                if (p1Index !== -1 && p2Index !== -1) {
                    document.getElementById('reroll-1').style.display = 'block';
                    document.getElementById('reroll-2').style.display = 'block';
                    document.getElementById('reset-all').style.display = 'block';
                }
            }, 1500);
        }
